name: Fetch Hurrier Data

on:
  schedule:
    # Runs every 5 minutes (GitHub Actions minimum is 5 min)
    # For ~1 minute refresh, the dashboard polls GitHub raw every 60s on its own
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  fetch-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch Hurrier data for all hubs
        env:
          TALABAT_TOKEN: ${{ secrets.TALABAT_API_TOKEN }}
        run: node scripts/fetch-hurrier.js

      - name: Commit and push updated data files
        run: |
          git config user.name  "hurrier-bot"
          git config user.email "hurrier-bot@noreply"
          git add data-*.json
          # Only commit if something actually changed
          git diff --cached --quiet || git commit -m "data: auto-update $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push
